name: Release

# Tag pushes (v*) build every target, attach the archives to a GitHub Release
# and publish to crates.io. A workflow_dispatch run builds the same targets but
# skips both publishing jobs, so the matrix can be proven without a tag.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest, cross: false }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, cross: true }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-latest, cross: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest, cross: true }
          - { target: x86_64-apple-darwin, os: macos-latest, cross: false }
          - { target: aarch64-apple-darwin, os: macos-latest, cross: false }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, cross: false }
          - { target: aarch64-pc-windows-msvc, os: windows-latest, cross: false }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target "${{ matrix.target }}"
          else
            cargo build --release --target "${{ matrix.target }}"
          fi
      - name: Package archive
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ "${GITHUB_REF_TYPE}" = "tag" ] || version="dev"
          staging="openspectation-${version}-${{ matrix.target }}"
          mkdir "$staging"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/openspectation.exe" \
               "target/${{ matrix.target }}/release/ospc.exe" "$staging/"
          else
            cp "target/${{ matrix.target }}/release/openspectation" \
               "target/${{ matrix.target }}/release/ospc" "$staging/"
          fi
          cp LICENSE README.md "$staging/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$staging.zip" "$staging"
            echo "ASSET=$staging.zip" >> "$GITHUB_ENV"
          else
            tar czf "$staging.tar.gz" "$staging"
            echo "ASSET=$staging.tar.gz" >> "$GITHUB_ENV"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  release:
    name: GitHub release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: assets/*
          generate_release_notes: true

  publish:
    name: Publish to crates.io
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      # The tag is the only thing that says which version is being released,
      # and nothing so far has checked it against the manifest. A tag that
      # disagrees would otherwise republish whatever the manifest happens to
      # hold, so refuse before an upload that cannot be taken back.
      - name: Check the tag against the manifest
        id: release
        shell: bash
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          name="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].name')"
          declared="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"

          if [ "$tagged" != "$declared" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} releases ${tagged}, but Cargo.toml declares ${declared}"
            exit 1
          fi

          # Bootstrapping a crate means publishing it by hand, because
          # crates.io only accepts a trusted publisher for a crate that
          # already exists. The first tag therefore names a version that is
          # already up, and so does a re-run of a partially failed release.
          if curl -sf -o /dev/null "https://crates.io/api/v1/crates/${name}/${tagged}"; then
            echo "::notice::${name} ${tagged} is already on crates.io; skipping the upload"
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
        if: steps.release.outputs.needed == 'true'
      - run: cargo publish
        if: steps.release.outputs.needed == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
