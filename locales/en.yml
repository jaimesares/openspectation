_version: 1

app:
  about: "Inspect, scaffold and explore OpenSpec workspaces from the terminal."
  after_help: "Run `openspectation <COMMAND> --help` for details about a command."
  locale_label: "Language"

cli:
  arg:
    path: "Workspace root where OpenSpec markers are looked up (specs/, changes/, design.md)"
    lang: "Force the interface language instead of detecting it from the system locale"
    no_color: "Disable ANSI colors in the command output"
  cmd:
    init:
      about: "Create a standard OpenSpec structure inside the workspace root"
      arg:
        name: "Human readable name of the project being specified"
        description: "Short description stored in openspec.yaml"
        force: "Overwrite files that already exist"
    list:
      about: "List every document found under the specs/ directory"
      arg:
        all: "Also print the change proposals stored under changes/"
        status: "Only show documents matching this status"
        sort: "Field used to sort the documents"
    tui:
      about: "Launch the full screen interactive dashboard"
      arg:
        tick_rate: "Redraw interval in milliseconds"
        change: "Open straight into this change proposal"
        theme: "Color palette; terminal inherits the emulator scheme, the rest ship fixed colors"
    diff:
      about: "Print the requirement delta declared by a change proposal"
      arg:
        change: "Change proposal to inspect; defaults to every active one"
    validate:
      about: "Validate the workspace with the openspec CLI"
      arg:
        change: "Change proposal to validate; defaults to the whole workspace"
        loose: "Relax the strict rule set"
    archive:
      about: "Archive a completed change with the openspec CLI"
      prompt: "[y/N]"
      arg:
        change: "Change proposal to archive"
        "yes": "Skip the confirmation prompt"
        skip_specs: "Leave the specifications untouched"
  help:
    usage: "Usage:"
    commands: "Commands"
    command_value: "COMMAND"
    arguments: "Arguments"
    options: "Options"
    help: "Print this help"
    version: "Print the version"

error:
  label: "error"
  hint_label: "hint"
  path_not_found: "The path `%{path}` does not exist."
  path_not_found_hint: "Check the value passed to --path, or create the directory first."
  not_a_directory: "The path `%{path}` is not a directory."
  not_a_directory_hint: "--path must point to a folder, not to a file."
  not_a_workspace: "`%{path}` is not an OpenSpec workspace."
  not_a_workspace_hint: "Run `openspectation init <NAME> --path %{path}` to create one."
  already_initialized: "`%{path}` already contains an OpenSpec workspace."
  already_initialized_hint: "Use --force to overwrite the existing boilerplate files."
  invalid_name: "`%{name}` is not a valid project name."
  invalid_name_hint: "Use letters, digits, spaces, dots, dashes or underscores."
  io: "Filesystem error on `%{path}`: %{reason}"
  yaml: "Invalid YAML in `%{path}`: %{reason}"
  terminal: "Terminal error: %{reason}"
  unknown_change: "There is no change proposal named `%{name}`."
  unknown_change_hint: "Run `openspectation list --all` to see the available identifiers."
  already_archived: "The change `%{name}` is already archived."
  validation_failed: "Validation failed for %{count} items."
  confirmation_required: "Archiving needs a confirmation and stdin is not a terminal."
  confirmation_required_hint: "Pass --yes to archive without being asked."
  task_moved: "`%{path}` line %{line} is no longer a task."
  task_moved_hint: "The file changed on disk. Press r to reload and try again."
  too_large_to_edit: "`%{path}` is too large to edit in place."
  too_large_to_edit_hint: "The editor holds the whole file in memory. Use E to open it in $EDITOR."
  cli_missing: "The openspec CLI is not installed."
  cli_missing_hint: "Install it with `npm install -g openspec`; validation and archiving are delegated to it."
  cli_failed: "openspec %{command} failed: %{reason}"

