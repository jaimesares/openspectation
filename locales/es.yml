_version: 1

app:
  about: "Inspecciona, genera y explora espacios de trabajo OpenSpec desde la terminal."
  after_help: "Ejecuta `openspectation <COMANDO> --help` para ver el detalle de un comando."
  locale_label: "Idioma"

cli:
  arg:
    path: "Raíz del espacio de trabajo donde se buscan los marcadores OpenSpec (specs/, changes/, design.md)"
    lang: "Fuerza el idioma de la interfaz en lugar de detectarlo del sistema"
    no_color: "Desactiva los colores ANSI en la salida del comando"
  cmd:
    init:
      about: "Crea la estructura OpenSpec estándar dentro de la raíz del espacio de trabajo"
      arg:
        name: "Nombre legible del proyecto que se va a especificar"
        description: "Descripción breve que se guarda en openspec.yaml"
        force: "Sobrescribe los ficheros que ya existan"
    list:
      about: "Lista todos los documentos encontrados en el directorio specs/"
      arg:
        all: "Muestra también las propuestas de cambio guardadas en changes/"
        status: "Muestra únicamente los documentos con este estado"
        sort: "Campo por el que se ordenan los documentos"
    tui:
      about: "Abre el panel interactivo a pantalla completa"
      arg:
        tick_rate: "Intervalo de redibujado en milisegundos"
        change: "Abre directamente en esta propuesta de cambio"
        theme: "Paleta de color; terminal hereda el esquema del emulador, el resto usan colores fijos"
    diff:
      about: "Imprime el delta de requisitos que declara una propuesta de cambio"
      arg:
        change: "Propuesta a inspeccionar; por defecto, todas las activas"
    validate:
      about: "Valida el espacio de trabajo con el CLI de openspec"
      arg:
        change: "Propuesta a validar; por defecto, el espacio de trabajo entero"
        loose: "Relaja el conjunto de reglas estricto"
    archive:
      about: "Archiva un cambio terminado con el CLI de openspec"
      prompt: "[s/N]"
      arg:
        change: "Propuesta de cambio que se va a archivar"
        "yes": "Omite la confirmación"
        skip_specs: "Deja las especificaciones intactas"
  help:
    usage: "Uso:"
    commands: "Comandos"
    command_value: "COMANDO"
    arguments: "Argumentos"
    options: "Opciones"
    help: "Muestra esta ayuda"
    version: "Muestra la versión"

error:
  label: "error"
  hint_label: "sugerencia"
  path_not_found: "La ruta `%{path}` no existe."
  path_not_found_hint: "Revisa el valor de --path o crea antes el directorio."
  not_a_directory: "La ruta `%{path}` no es un directorio."
  not_a_directory_hint: "--path debe apuntar a una carpeta, no a un fichero."
  not_a_workspace: "`%{path}` no es un espacio de trabajo OpenSpec."
  not_a_workspace_hint: "Ejecuta `openspectation init <NOMBRE> --path %{path}` para crearlo."
  already_initialized: "`%{path}` ya contiene un espacio de trabajo OpenSpec."
  already_initialized_hint: "Usa --force para sobrescribir los ficheros existentes."
  invalid_name: "`%{name}` no es un nombre de proyecto válido."
  invalid_name_hint: "Usa letras, dígitos, espacios, puntos, guiones o guiones bajos."
  io: "Error del sistema de ficheros en `%{path}`: %{reason}"
  yaml: "YAML no válido en `%{path}`: %{reason}"
  terminal: "Error de terminal: %{reason}"
  unknown_change: "No existe ninguna propuesta de cambio llamada `%{name}`."
  unknown_change_hint: "Ejecuta `openspectation list --all` para ver los identificadores disponibles."
  already_archived: "El cambio `%{name}` ya está archivado."
  validation_failed: "La validación ha fallado en %{count} elementos."
  confirmation_required: "Archivar requiere confirmación y stdin no es una terminal."
  confirmation_required_hint: "Usa --yes para archivar sin preguntar."
  task_moved: "La línea %{line} de `%{path}` ya no es una tarea."
  task_moved_hint: "El fichero ha cambiado en disco. Pulsa r para recargar e inténtalo de nuevo."
  too_large_to_edit: "`%{path}` es demasiado grande para editarlo aquí."
  too_large_to_edit_hint: "El editor mantiene el fichero entero en memoria. Usa E para abrirlo en $EDITOR."
  cli_missing: "El CLI de openspec no está instalado."
  cli_missing_hint: "Instálalo con `npm install -g openspec`; la validación y el archivado se delegan en él."
  cli_failed: "openspec %{command} ha fallado: %{reason}"

init:
  header: "Creando el espacio de trabajo OpenSpec `%{name}`"
  target: "Destino"
  created: "creado"
  overwritten: "sobrescrito"
  exists: "ya existía"
